    <!--
  STEP 6 · Contact and footer
  1. On GitHub, open an issue titled "Add contact section".
  2. git switch -c feat/contact
  3. Save this file as parts/contact.html
  4. Put your real GitHub username and email. Check the page with Live Server.
  5. git add parts/contact.html
     git commit -m "feat(contact): add contact links and footer"
     git push -u origin feat/contact
  6. Open a pull request with "Closes #1" in the description, then merge it.
-->
<section id="contact">
    <h2>Contact</h2>
    <ul class="links">
      <li><a href="https://github.com/YOUR-USERNAME">GitHub</a></li>
      <li><a href="mailto:you@example.com">you@example.com</a></li>
    </ul>
  </section>
  <footer>
    <p id="tagline">Built with Git and GitHub.</p>
  </footer>
    
</body>
